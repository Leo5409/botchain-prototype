<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODYSSEY · 二期管理后台原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 13px; display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar { width: 240px; background: #141627; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { padding: 20px 20px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #5b6af0, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .logo-text { color: #fff; font-size: 14px; font-weight: 600; line-height: 1.2; }
  .logo-text small { display: block; font-size: 10px; color: rgba(255,255,255,.45); font-weight: 400; margin-top: 2px; letter-spacing: .5px; }
  .nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .nav-group-title { color: rgba(255,255,255,.3); font-size: 11px; letter-spacing: 1px; padding: 14px 20px 6px; text-transform: uppercase; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; color: rgba(255,255,255,.55); cursor: pointer; transition: all .15s; font-size: 13px; }
  .nav-item:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.9); }
  .nav-item.active { background: rgba(91,106,240,.2); color: #7c8ff7; border-right: 2px solid #5b6af0; }
  .nav-item .ic { width: 16px; text-align: center; flex-shrink: 0; }
  .nav-badge { margin-left: auto; background: #ef4444; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 10px; }
  .nav-badge.warn { background: #f59e0b; }
  .nav-badge.new { background: #10b981; }
  .sidebar-bottom { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; gap: 10px; }
  .avatar { width: 28px; height: 28px; background: linear-gradient(135deg, #5b6af0, #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; }
  .admin-name { color: rgba(255,255,255,.75); font-size: 12px; line-height: 1.2; }
  .admin-role { color: rgba(255,255,255,.4); font-size: 10px; }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 52px; background: #fff; border-bottom: 1px solid #e8eaed; display: flex; align-items: center; padding: 0 24px; gap: 8px; flex-shrink: 0; }
  .breadcrumb { display: flex; align-items: center; gap: 6px; color: #6b7280; font-size: 13px; }
  .breadcrumb .current { color: #1a1a2e; font-weight: 500; }
  .breadcrumb-sep { color: #d1d5db; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .session-badge { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .session-badge .s-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

  /* ── Content ── */
  .content { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .page { display: none; }
  .page.active { display: block; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .page-title { font-size: 16px; font-weight: 600; color: #1a1a2e; }
  .page-subtitle { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  .tag-module { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eef0fe; color: #5b6af0; font-weight: 600; margin-left: 8px; vertical-align: middle; }
  .tag-new { background: #d1fae5; color: #065f46; }

  /* ── Card ── */
  .card { background: #fff; border-radius: 10px; border: 1px solid #e8eaed; margin-bottom: 14px; }
  .card-header { padding: 14px 20px; border-bottom: 1px solid #f3f4f6; display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-size: 13px; font-weight: 600; color: #374151; display: flex; align-items: center; gap: 7px; }
  .card-title::before { content: ''; width: 3px; height: 14px; background: #5b6af0; border-radius: 2px; display: inline-block; }
  .card-body { padding: 16px 20px; }

  /* ── Stat Grid ── */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat-card { background: #fff; border: 1px solid #e8eaed; border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: #9ca3af; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .stat-value { font-size: 20px; font-weight: 700; color: #1a1a2e; font-variant-numeric: tabular-nums; }
  .stat-value small { font-size: 11px; font-weight: 400; color: #9ca3af; margin-left: 4px; }
  .stat-trend { font-size: 11px; margin-top: 4px; }
  .stat-trend.up { color: #ef4444; }
  .stat-trend.down { color: #10b981; }
  .stat-trend.neutral { color: #9ca3af; }
  .stat-card.alert { border-color: #fecaca; background: linear-gradient(135deg, #fef2f2, #fff); }
  .stat-card.warn { border-color: #fde68a; background: linear-gradient(135deg, #fffbeb, #fff); }
  .stat-card.ok { border-color: #a7f3d0; background: linear-gradient(135deg, #ecfdf5, #fff); }

  /* ── Filter ── */
  .filter-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
  .form-group.wide { flex: 1.5; }
  .form-label { font-size: 12px; color: #6b7280; }
  .req { color: #ef4444; }
  .form-input, .form-select { height: 32px; border: 1px solid #e0e2e7; border-radius: 6px; padding: 0 10px; font-size: 12px; color: #374151; background: #fafafa; outline: none; width: 100%; transition: border-color .15s; }
  .form-input:focus, .form-select:focus { border-color: #5b6af0; background: #fff; }
  .form-input::placeholder { color: #c0c4cc; }
  .form-textarea { min-height: 70px; padding: 8px 10px; border: 1px solid #e0e2e7; border-radius: 6px; font-size: 12px; color: #374151; background: #fafafa; outline: none; width: 100%; font-family: inherit; resize: vertical; }
  .form-textarea:focus { border-color: #5b6af0; background: #fff; }
  .filter-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ── Buttons ── */
  .btn { height: 32px; padding: 0 16px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 5px; transition: all .15s; }
  .btn-primary { background: #5b6af0; color: #fff; }
  .btn-primary:hover { background: #4f5de6; }
  .btn-secondary { background: #fff; color: #374151; border: 1px solid #e0e2e7; }
  .btn-secondary:hover { background: #f9fafb; border-color: #d1d5db; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-success:hover { background: #059669; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-warn { background: #f59e0b; color: #fff; }
  .btn-warn:hover { background: #d97706; }
  .btn-sm { height: 26px; padding: 0 10px; font-size: 11px; }
  .btn-ghost { background: none; border: 1px dashed #d1d5db; color: #6b7280; }
  .btn-ghost:hover { border-color: #5b6af0; color: #5b6af0; }

  /* ── Table ── */
  .table-wrapper { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead tr { background: #f8f9fd; }
  th { padding: 10px 14px; text-align: left; color: #6b7280; font-weight: 600; font-size: 11px; white-space: nowrap; border-bottom: 1px solid #e8eaed; }
  td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; color: #374151; white-space: nowrap; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbff; }
  .td-address { font-family: monospace; font-size: 11px; color: #5b6af0; cursor: pointer; white-space: nowrap; }
  .td-address:hover { text-decoration: underline; }
  .td-num { text-align: right; font-variant-numeric: tabular-nums; }
  .td-mono { font-family: monospace; font-size: 11px; color: #4f5de6; white-space: nowrap; }
  .td-green { color: #059669; font-weight: 600; }
  .td-red   { color: #dc2626; font-weight: 600; }
  .td-blue  { color: #2563eb; font-weight: 500; }
  .td-orange { color: #d97706; font-weight: 600; }
  .ops-cell { display: flex; align-items: center; gap: 6px; }

  /* ── Badges ── */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-process { background: #dbeafe; color: #1d4ed8; }
  .badge-signing { background: #ede9fe; color: #5b21b6; }
  .badge-done    { background: #d1fae5; color: #065f46; }
  .badge-fail    { background: #fee2e2; color: #991b1b; }
  .badge-grey    { background: #f3f4f6; color: #6b7280; }
  .badge-warn    { background: #fef3c7; color: #92400e; }
  .badge-info    { background: #eef0fe; color: #4f5de6; }
  .badge-usdt    { background: #ccfbf1; color: #0f766e; }
  .badge-special { background: #ffe4e6; color: #be123c; }

  /* ── Status Dot ── */
  .dot-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot-on { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
  .dot-off { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
  .dot-wait { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.18); }

  /* ── Pagination ── */
  .table-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid #f3f4f6; }
  .pagination { display: flex; align-items: center; gap: 4px; }
  .page-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #e0e2e7; background: #fff; color: #374151; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .page-btn:hover { border-color: #5b6af0; color: #5b6af0; }
  .page-btn.active { background: #5b6af0; border-color: #5b6af0; color: #fff; }
  .page-btn.disabled { opacity: .4; cursor: not-allowed; }
  .total-count { font-size: 12px; color: #9ca3af; }
  .total-count strong { color: #374151; }

  /* ── Detail / Trace ── */
  .detail-block { padding: 16px 20px; border-top: 1px solid #f3f4f6; }
  .detail-block:first-child { border-top: none; }
  .trace-table th, .trace-table td { padding: 8px 12px; }
  .trace-table tfoot td { background: #f8f9fd; font-weight: 700; color: #1a1a2e; border-top: 2px solid #e8eaed; }

  /* ── Checkbox ── */
  .ck { width: 15px; height: 15px; accent-color: #5b6af0; cursor: pointer; }

  /* ── Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal { background: #fff; border-radius: 12px; width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.2); transform: translateY(10px); transition: transform .2s; max-height: 90vh; overflow: auto; }
  .modal.large { width: 620px; }
  .modal.wide { width: 760px; }
  .modal-overlay.show .modal { transform: none; }
  .modal-header { padding: 20px 24px 12px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid #f3f4f6; }
  .modal-title { font-size: 15px; font-weight: 700; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
  .modal-title.danger { color: #dc2626; }
  .modal-close { width: 28px; height: 28px; border-radius: 6px; border: none; background: none; cursor: pointer; color: #9ca3af; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .modal-close:hover { background: #f3f4f6; color: #374151; }
  .modal-body { padding: 16px 24px 20px; }
  .modal-body .form-group { margin-bottom: 12px; }
  .modal-footer { padding: 12px 24px 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid #f3f4f6; }
  .modal-info-row { display: flex; align-items: center; gap: 10px; font-size: 12px; padding: 7px 0; border-bottom: 1px dashed #f3f4f6; }
  .modal-info-row:last-child { border-bottom: none; }
  .modal-info-row .lbl { color: #9ca3af; min-width: 96px; }
  .modal-info-row .val { color: #1a1a2e; font-weight: 500; word-break: break-all; }
  .modal-alert { padding: 10px 12px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; color: #92400e; font-size: 12px; line-height: 1.6; margin-bottom: 12px; display: flex; gap: 8px; align-items: flex-start; }
  .modal-alert.danger { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
  .modal-alert.info { background: #eef0fe; border-color: #c7d2fe; color: #3730a3; }
  .modal-alert .icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── Misc ── */
  .empty-hint { padding: 40px 20px; text-align: center; color: #9ca3af; font-size: 12px; }
  .text-mute { color: #9ca3af; }
  .text-mono { font-family: monospace; }
  .divider-h { height: 1px; background: #f3f4f6; margin: 14px 0; }
  .inline-tag { display: inline-block; padding: 1px 6px; background: #f3f4f6; color: #6b7280; border-radius: 4px; font-size: 10px; margin-left: 4px; }
  .pill { display:inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight:600; }
  .pill-v { background:#eef0fe; color:#4f5de6; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a1a2e; color: #fff; padding: 11px 20px; border-radius: 8px; font-size: 13px; z-index: 2000; opacity: 0; transition: all .25s; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  /* ── A2 后台新增 ── */
  .login-wrap { display:flex; align-items:center; justify-content:center; padding:40px 0; }
  .login-card { width:380px; background:#fff; border:1px solid #e8eaed; border-radius:14px; box-shadow:0 12px 40px rgba(20,22,39,.10); padding:30px 30px 26px; }
  .login-logo { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:6px; }
  .login-logo .logo-icon { width:36px; height:36px; font-size:18px; }
  .login-title { text-align:center; font-size:17px; font-weight:700; color:#1a1a2e; margin-bottom:4px; }
  .login-sub { text-align:center; font-size:12px; color:#9ca3af; margin-bottom:22px; }
  .login-card .form-group { margin-bottom:14px; }
  .login-card .form-input { height:38px; }
  .ga-row { display:flex; gap:8px; }
  .ga-box { flex:1; height:44px; border:1px solid #e0e2e7; border-radius:8px; background:#fafafa; text-align:center; font-size:20px; font-weight:700; color:#374151; line-height:42px; font-variant-numeric:tabular-nums; }
  .ga-box.filled { border-color:#5b6af0; background:#fff; color:#5b6af0; }
  .kvbox { background:#f8f9fd; border:1px solid #e8eaed; border-radius:8px; padding:10px 12px; font-size:11.5px; color:#4b5563; line-height:1.9; font-family:monospace; }
  .diff-old { background:#fef2f2; color:#991b1b; padding:1px 6px; border-radius:4px; font-family:monospace; font-size:11px; }
  .diff-new { background:#ecfdf5; color:#065f46; padding:1px 6px; border-radius:4px; font-family:monospace; font-size:11px; }
  .perm-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 14px; }
  .perm-item { display:flex; align-items:center; gap:7px; font-size:12px; color:#374151; }
  .lang-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .lang-tab { padding:4px 10px; border-radius:7px; border:1px solid #e0e2e7; background:#fafafa;
              font-size:11.5px; color:#6b7280; cursor:pointer; user-select:none; }
  .lang-tab:hover { border-color:#c7cbf5; }
  .lang-tab.on { background:#5b6af0; border-color:#5b6af0; color:#fff; font-weight:600; }
  .lang-tab .dot { display:inline-block; width:5px; height:5px; border-radius:50%;
                   background:#10b981; margin-left:5px; vertical-align:middle; }
  .lang-tab.on .dot { background:#fff; }
  .lang-chip { display:inline-block; padding:2px 8px; border-radius:6px; background:#eef0fe; color:#4f5de6; font-size:11px; font-weight:600; }
  .pill-t { background:#ecfdf5; color:#047857; }
  .pill-none { background:#f3f4f6; color:#9ca3af; }
  .sumrow td { background:#f8f9fd; font-weight:700; color:#1a1a2e; }
  .node-info-bar { background: linear-gradient(135deg,#eef0fe,#f5f3ff); border:1px solid #c7d2fe; border-radius:10px; padding:14px 20px; margin-bottom:14px; display:flex; align-items:center; flex-wrap:wrap; }
  .node-info-item { padding:0 20px; border-right:1px solid #c7d2fe; }
  .node-info-item:first-child { padding-left:0; }
  .node-info-item:last-child { border-right:none; }
  .node-info-label { font-size:11px; color:#6b7280; margin-bottom:4px; }
  .node-info-value { font-size:13px; font-weight:600; color:#1a1a2e; }
  .node-info-addr { font-family:monospace; font-size:11.5px; color:#4f5de6; font-weight:600; }
  .bcbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .bc-item { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:#5b6af0; cursor:pointer; padding:4px 10px; border-radius:6px; border:1px solid #e8eaed; background:#fff; transition:all .15s; white-space:nowrap; }
  .bc-item:hover { background:#f0f1fe; border-color:#5b6af0; }
  .bc-item.active { background:#eef0fe; border-color:#5b6af0; color:#374151; font-weight:600; cursor:default; }
  .bc-arrow { color:#d1d5db; font-size:14px; flex-shrink:0; }
  .no-children { color:#9ca3af; font-size:11px; font-style:italic; }
  .drill { cursor:pointer; color:#4f5de6; font-weight:600; }
.mt-legend { display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:#9ca3af; margin-bottom:10px; }
.mtree { font-size:13px; color:#374151; overflow-x:auto; }
.mt-line { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; white-space:nowrap; }
.mt-line:hover { background:#f9fafb; }
.mt-line.hit { background:#fef9c3; box-shadow:inset 3px 0 0 #f59e0b; }
.mt-tog { width:16px; flex-shrink:0; text-align:center; color:#4b5563; cursor:pointer; font-size:11px; user-select:none; }
.mt-tog.leaf { cursor:default; color:transparent; }
.mt-addr { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; color:#1f2937; }
.mt-cnt { color:#6b7280; }
.mt-copy { color:#3b82f6; cursor:pointer; font-size:12px; }
.mt-meta { display:flex; align-items:center; gap:6px; color:#6b7280; font-size:12px; }
.mt-meta b { color:#111827; font-weight:600; }
.mt-sep { color:#d1d5db; }
.mt-kids { margin-left:18px; border-left:1px dashed #e5e7eb; }
.pill-geo { white-space:nowrap; background:#e0f2fe; color:#0369a1; } .pill-geo-off { opacity:.55; text-decoration:line-through; }
.geo-list { max-height:120px; overflow:auto; background:#f9fafb; border:1px solid #eef0f4; border-radius:8px; padding:6px 10px; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:#374151; line-height:1.7; margin-top:6px; word-break:break-all; }
  .drill:hover { text-decoration:underline; }

  .sw { display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; color:#374151; height:36px; }
  .sw input { display:none; } .sw span { width:36px; height:20px; border-radius:20px; background:#d1d5db; position:relative; transition:.2s; flex-shrink:0; }
